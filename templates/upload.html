<!DOCTYPE html>
<html>
<head>
<title>Upload</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container mt-4">
<h3>Vehicle Type & Load Classification</h3>

<form method="post" enctype="multipart/form-data">
<input type="file" name="file" class="form-control mt-2" accept="image/*">
<input type="text" name="url" class="form-control mt-2" placeholder="Enter Image URL">
<button class="btn btn-primary mt-3">Predict</button>
</form>

{% if result %}
<div class="alert alert-success mt-3">{{ result }}</div>
{% endif %}

<a href="/logout">Logout</a>
</div>
</body>
</html>
